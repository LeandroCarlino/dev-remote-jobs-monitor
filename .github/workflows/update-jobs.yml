name: Update Remote Jobs Monitor

on:
  schedule:
    # Run every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🚀 Run crawler & generate data
        run: |
          python src/main.py

      - name: 💾 Commit & Push if changes found
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(jobs): auto-update remote dev listings [skip ci]"
          file_pattern: "data/jobs.json data/stats.json web/data/jobs.json web/data/stats.json README.md"
